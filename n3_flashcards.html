<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>N3 Grammar Flashcards</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;600&family=DM+Mono:wght@400;500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #11111a;
  --surface: #1c1c28;
  --surface2: #242434;
  --border: #2e2e42;
  --border2: #3e3e56;
  --text: #e8e6f0;
  --text2: #a8a5be;
  --text3: #6a6880;
  --accent: #7b8fff;
  --accent-bg: #1a1f45;
  --accent-text: #a0a8ff;
  --gold: #f0b840;
  --gold-bg: #2a2010;
  --teal: #2dd4bf;
  --teal-bg: #0a2826;
  --coral: #f87171;
  --coral-bg: #2a1010;
  --green: #4ade80;
  --green-bg: #0a2414;
  --tag-core-bg: #2a1f50;
  --tag-core-text: #c4b5fd;
  --tag-iplus-bg: #0a2820;
  --tag-iplus-text: #6ee7b7;
  --tag-n3-bg: #0f1e3a;
  --tag-n3-text: #93c5fd;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; }
body {
  font-family: 'Inter', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  line-height: 1.6;
}
.app { max-width: 800px; margin: 0 auto; padding: 1.5rem 1rem 4rem; }

/* header */
header {
  display: flex; align-items: center; gap: 1rem;
  margin-bottom: 1.5rem; padding-bottom: 1.25rem;
  border-bottom: 2px solid var(--border);
  flex-wrap: wrap;
}
.logo { font-size: 1.2rem; font-weight: 700; color: var(--text); letter-spacing: -0.02em; white-space: nowrap; }
.logo em { color: var(--accent); font-style: normal; }
.prog-wrap { flex: 1; min-width: 140px; }
.prog-bar { height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
.prog-fill { height: 100%; background: var(--accent); border-radius: 3px; transition: width 0.4s; }
.prog-label { font-size: 12px; color: var(--text3); margin-top: 4px; font-family: 'DM Mono', monospace; }

/* search */
.search-wrap { position: relative; min-width: 160px; }
.search-wrap::before { content: '🔍'; position: absolute; left: 10px; top: 50%; transform: translateY(-50%); font-size: 13px; pointer-events: none; }
.search-wrap input {
  width: 100%; padding: 7px 12px 7px 32px;
  border: 1.5px solid var(--border2); border-radius: 8px;
  background: var(--surface); color: var(--text);
  font-size: 14px; font-family: 'Inter', sans-serif;
  outline: none; transition: border-color 0.2s;
}
.search-wrap input:focus { border-color: var(--accent); }
.search-wrap input::placeholder { color: var(--text3); }

/* filters */
.filters { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 1.25rem; align-items: center; }
.filter-btn {
  font-size: 12px; font-weight: 600; padding: 5px 14px;
  border-radius: 20px; border: 1.5px solid var(--border2);
  background: var(--surface); color: var(--text2);
  cursor: pointer; transition: all 0.15s; font-family: 'Inter', sans-serif;
}
.filter-btn:hover { border-color: var(--accent); color: var(--accent-text); background: var(--accent-bg); }
.filter-btn.active { border-color: var(--accent); color: var(--accent-text); background: var(--accent-bg); font-weight: 700; }
select#cat-filter {
  font-size: 12px; font-weight: 600; padding: 5px 14px;
  border-radius: 20px; border: 1.5px solid var(--border2);
  background: var(--surface); color: var(--text2);
  cursor: pointer; font-family: 'Inter', sans-serif; outline: none;
}
select#cat-filter:focus { border-color: var(--accent); }

/* stats */
.deck-stats { font-size: 13px; color: var(--text3); margin-bottom: 1rem; }
.deck-stats strong { color: var(--text2); font-weight: 600; }

/* grid */
.deck { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; }

/* mini card */
.mini-card {
  background: var(--surface); border: 1.5px solid var(--border);
  border-radius: 12px; padding: 14px 16px; cursor: pointer;
  transition: all 0.15s; position: relative;
}
.mini-card:hover { border-color: var(--accent); background: var(--accent-bg); transform: translateY(-1px); box-shadow: 0 4px 12px rgba(61,82,204,0.1); }
.mini-card.mastered { border-color: var(--green); background: var(--green-bg); }
.mc-cat { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text3); margin-bottom: 6px; }
.mc-grammar { font-family: 'Noto Serif JP', serif; font-size: 15px; color: var(--text); margin-bottom: 4px; line-height: 1.4; }
.mc-meaning { font-size: 12px; color: var(--text2); line-height: 1.4; }
.mc-badge { position: absolute; top: 10px; right: 10px; font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 99px; }
.badge-core { background: var(--tag-core-bg); color: var(--tag-core-text); }
.badge-done { background: var(--green-bg); color: var(--green); border: 1px solid var(--green); }

/* card view */
.card-view { display: none; }
.card-view.active { display: block; }
.deck.hidden { display: none; }
.ctrl-back {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 13px; font-weight: 600; color: var(--text2);
  cursor: pointer; padding: 6px 0; margin-bottom: 1rem;
  border: none; background: none; font-family: 'Inter', sans-serif;
}
.ctrl-back:hover { color: var(--accent); }

/* flashcard */
.flashcard {
  background: var(--surface); border: 1.5px solid var(--border);
  border-radius: 16px; overflow: hidden; margin-bottom: 1rem;
  box-shadow: 0 2px 16px rgba(0,0,0,0.06);
}

/* card top */
.card-top { padding: 1.75rem 2rem 1.5rem; border-bottom: 1.5px solid var(--border); }
.card-nav-label {
  font-size: 11px; font-weight: 600; text-transform: uppercase;
  letter-spacing: 0.08em; color: var(--text3); margin-bottom: 0.75rem;
  font-family: 'DM Mono', monospace;
}
.card-cat-badge {
  display: inline-block; font-size: 11px; font-weight: 700;
  padding: 3px 10px; border-radius: 6px; margin-bottom: 0.75rem;
  background: var(--gold-bg); color: var(--gold);
  letter-spacing: 0.02em;
}
.card-grammar {
  font-family: 'Noto Serif JP', serif; font-size: 2rem; font-weight: 600;
  color: var(--text); line-height: 1.3; margin-bottom: 0.3rem;
}
.card-reading { font-family: 'DM Mono', monospace; font-size: 13px; color: var(--accent); margin-bottom: 0.6rem; font-weight: 500; }
.card-meaning { font-size: 1.05rem; color: var(--text2); font-weight: 500; }

/* sections */
.section { padding: 1.25rem 2rem; border-bottom: 1.5px solid var(--border); }
.section:last-child { border-bottom: none; }
.section-label {
  font-size: 10px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--text3); margin-bottom: 0.9rem; display: flex; align-items: center; gap: 8px;
}
.section-label::after { content: ''; flex: 1; height: 1px; background: var(--border); }

/* formation */
.formation-grid { display: flex; flex-direction: column; gap: 8px; }
.formation-row { display: flex; align-items: baseline; gap: 12px; padding: 6px 10px; background: var(--surface2); border-radius: 8px; }
.f-type { font-size: 12px; color: var(--text3); min-width: 130px; font-family: 'DM Mono', monospace; flex-shrink: 0; }
.f-form { font-family: 'Noto Serif JP', serif; font-size: 15px; color: var(--text); line-height: 1.5; }
.f-form mark { background: var(--accent-bg); color: var(--accent-text); border-radius: 4px; padding: 0 3px; font-style: normal; }

/* nuance */
.nuance-text { font-size: 15px; color: var(--text); line-height: 1.75; }
.nuance-text em { color: var(--teal); font-style: normal; font-weight: 600; }
.nuance-text strong { color: var(--gold); font-weight: 700; }

/* use cases */
.use-list { display: flex; flex-direction: column; gap: 8px; }
.use-item { display: flex; gap: 10px; font-size: 14px; color: var(--text); line-height: 1.5; }
.use-dot { color: var(--accent); font-weight: 700; flex-shrink: 0; }

/* contrast */
.contrast-grid { display: flex; flex-direction: column; gap: 10px; }
.contrast-row { display: flex; gap: 10px; align-items: flex-start; }
.contrast-tag { font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 6px; white-space: nowrap; margin-top: 2px; flex-shrink: 0; }
.ct-this { background: var(--accent-bg); color: var(--accent-text); }
.ct-other { background: var(--coral-bg); color: var(--coral); }
.contrast-text { font-size: 14px; color: var(--text2); line-height: 1.6; }
.contrast-text span { font-family: 'Noto Serif JP', serif; color: var(--text); display: block; margin-bottom: 2px; }

/* examples */
.examples { display: flex; flex-direction: column; gap: 12px; }
.example { border-radius: 10px; padding: 14px 16px; border-left: 3px solid var(--accent); background: var(--surface2); }
.example.iplus { border-left-color: var(--teal); background: var(--teal-bg); }
.ex-badge { font-size: 10px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; padding: 2px 8px; border-radius: 4px; display: inline-block; margin-bottom: 8px; }
.badge-n3 { background: var(--tag-n3-bg); color: var(--tag-n3-text); }
.badge-iplus { background: var(--tag-iplus-bg); color: var(--tag-iplus-text); }
.ex-jp { font-family: 'Noto Serif JP', serif; font-size: 16px; color: var(--text); margin-bottom: 6px; line-height: 1.7; }
.ex-jp mark { background: var(--accent-bg); color: var(--accent-text); border-radius: 3px; padding: 0 3px; font-style: normal; }
.example.iplus .ex-jp mark { background: rgba(10,124,110,0.12); color: var(--teal); }
.ex-np { font-size: 13px; color: var(--text2); margin-bottom: 3px; line-height: 1.5; font-family: 'Noto Serif JP', serif; }
.ex-en { font-size: 13px; color: var(--text3); line-height: 1.5; font-style: italic; }

/* nav controls */
.card-controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.ctrl-btn {
  padding: 9px 20px; border-radius: 10px; font-size: 14px; font-weight: 600;
  border: 1.5px solid var(--border2); background: var(--surface); color: var(--text);
  cursor: pointer; font-family: 'Inter', sans-serif; transition: all 0.15s;
}
.ctrl-btn:hover { border-color: var(--accent); color: var(--accent-text); background: var(--accent-bg); }
.ctrl-btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
.ctrl-btn.primary:hover { background: var(--accent-text); }
.ctrl-btn.mastered-btn { border-color: var(--border2); color: var(--text2); }
.ctrl-btn.mastered-btn.done { border-color: var(--green); color: var(--green); background: var(--green-bg); }

.empty { text-align: center; padding: 3rem 1rem; color: var(--text3); font-size: 15px; }

/* ── Tab bar ── */
.tab-bar {
  display: flex; gap: 4px; padding: 10px 12px 0;
  background: var(--surface); border-bottom: 2px solid var(--border);
  position: sticky; top: 0; z-index: 100;
  overflow-x: auto; -webkit-overflow-scrolling: touch;
}
.tab-btn {
  padding: 8px 18px; font-size: 14px; font-weight: 600;
  border: none; border-bottom: 3px solid transparent;
  background: transparent; color: var(--text3);
  cursor: pointer; font-family: 'Inter', sans-serif;
  white-space: nowrap; transition: all 0.15s;
  margin-bottom: -2px; border-radius: 6px 6px 0 0;
}
.tab-btn:hover { color: var(--accent); background: var(--accent-bg); }
.tab-btn.active { color: var(--accent-text); border-bottom-color: var(--accent); background: var(--accent-bg); }

/* ── Tab sections ── */
.tab-section { display: none; }
.tab-section.active { display: block; }

/* ── Vocab section ── */
.vocab-section {
  background: var(--bg); min-height: 100vh; padding: 1.5rem 1rem 4rem;
  font-family: 'Inter', sans-serif;
}
.vocab-inner { max-width: 680px; margin: 0 auto; }
.vocab-header { display: flex; align-items: center; gap: 1rem; margin-bottom: 1.25rem; flex-wrap: wrap; }
.vocab-title { font-size: 1.1rem; font-weight: 700; color: var(--text); }
.vocab-counter { font-family: 'DM Mono', monospace; font-size: 13px; color: var(--text2); margin-left: auto; }

/* Vocab group filter */
.vocab-groups { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 1.25rem; }
.vg-btn {
  font-size: 12px; font-weight: 600; padding: 5px 14px;
  border-radius: 20px; border: 1.5px solid var(--border2);
  background: var(--surface); color: var(--text);
  cursor: pointer; transition: all 0.15s; font-family: 'Inter', sans-serif;
}
.vg-btn:hover { border-color: var(--accent); color: var(--accent-text); background: var(--accent-bg); }
.vg-btn.active { border-color: var(--accent); color: var(--accent-text); background: var(--accent-bg); font-weight: 700; }

/* Vocab progress bar */
.vocab-prog { height: 6px; background: var(--border); border-radius: 3px; margin-bottom: 1.25rem; overflow: hidden; }
.vocab-prog-fill { height: 100%; background: var(--accent); border-radius: 3px; transition: width 0.4s; }

/* Vocab card */
.vocab-card {
  background: var(--surface); border: 1.5px solid var(--border);
  border-radius: 16px; overflow: hidden; cursor: pointer;
  box-shadow: 0 2px 16px rgba(0,0,0,0.06); margin-bottom: 1.25rem;
  transition: transform 0.1s;
}
.vocab-card:hover { transform: translateY(-2px); box-shadow: 0 4px 20px rgba(61,82,204,0.1); }
.vocab-card-front { padding: 2.5rem 2rem 2rem; min-height: 220px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
.vocab-group-label {
  font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--accent); margin-bottom: 1rem; font-family: 'DM Mono', monospace;
}
.vocab-word {
  font-family: 'Noto Serif JP', serif; font-size: 2.4rem; font-weight: 600;
  color: var(--text); line-height: 2; margin-bottom: 0.5rem;
}
.vocab-word ruby { display: inline-flex; flex-direction: column-reverse; align-items: center; line-height: 1; }
.vocab-word ruby rt { font-size: 0.85rem; color: #e879f9; font-weight: 400; line-height: 1.4; }
.vocab-pos { font-size: 13px; color: var(--text2); margin-top: 0.5rem; font-style: italic; font-family: 'Inter', sans-serif; }
.vocab-flip-hint { font-size: 12px; color: var(--text2); margin-top: 1.5rem; font-family: 'Inter', sans-serif; }

/* Vocab card back */
.vocab-card-back { display: none; padding: 1.75rem 2rem; }
.vocab-card.flipped .vocab-card-front { display: none; }
.vocab-card.flipped .vocab-card-back { display: block; }
.vocab-keyword {
  font-family: 'Noto Serif JP', serif; font-size: 1.6rem; font-weight: 600; color: var(--text);
  margin-bottom: 0.3rem;
}
.vocab-meaning { font-size: 1rem; color: var(--text); margin-bottom: 1.25rem; font-family: 'Inter', sans-serif; line-height: 1.6; }
.vocab-back-section { margin-bottom: 1rem; }
.vocab-back-label {
  font-size: 10px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--text2); margin-bottom: 0.6rem; display: flex; align-items: center; gap: 8px;
}
.vocab-back-label::after { content: ''; flex: 1; height: 1px; background: var(--border); }
.vocab-particle-row { display: flex; gap: 10px; align-items: baseline; margin-bottom: 6px; padding: 6px 10px; background: var(--surface2); border-radius: 8px; }
.vocab-particle-ruby { font-family: 'Noto Serif JP', serif; font-size: 15px; color: var(--text); min-width: 150px; line-height: 2.2; }
.vocab-particle-ruby ruby rt { font-size: 0.7em; color: #e879f9; }
.vocab-particle-en { font-size: 13px; color: var(--text); font-family: 'Inter', sans-serif; line-height: 1.5; }
.vocab-example { border-radius: 10px; padding: 12px 14px; border-left: 3px solid var(--accent); background: var(--surface2); margin-bottom: 8px; }
.vocab-example-jp { font-family: 'Noto Serif JP', serif; font-size: 15px; color: var(--text); margin-bottom: 5px; line-height: 2.2; }
.vocab-example-jp ruby rt { font-size: 0.7em; color: #e879f9; }
.vocab-example-en { font-size: 13px; color: var(--text2); font-style: italic; font-family: 'Inter', sans-serif; line-height: 1.5; }

/* Vocab controls */
.vocab-controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.vc-btn {
  padding: 9px 20px; border-radius: 10px; font-size: 14px; font-weight: 600;
  border: 1.5px solid var(--border2); background: var(--surface); color: var(--text);
  cursor: pointer; font-family: 'Inter', sans-serif; transition: all 0.15s;
}
.vc-btn:hover { border-color: var(--accent); color: var(--accent-text); background: var(--accent-bg); }
.vc-btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
.vc-btn.primary:hover { background: var(--accent-text); }
.vc-btn.known { border-color: var(--green); color: var(--green); }
.vc-btn.known.active { background: var(--green-bg); }
.vc-btn.hard { border-color: var(--coral); color: var(--coral); }
.vc-btn.hard.active { background: var(--coral-bg); }
</style>
</head>
<body>
<nav class="tab-bar">
  <button class="tab-btn active" onclick="switchTab('grammar',this)">Grammar</button>
  <button class="tab-btn" onclick="switchTab('vocab1',this)">Vocab 1</button>
  <button class="tab-btn" onclick="switchTab('vocab2',this)">Vocab 2</button>
  <button class="tab-btn" onclick="switchTab('vocab3',this)">Vocab 3</button>
  <button class="tab-btn" onclick="switchTab('vocab4',this)">Vocab 4</button>
</nav>

<div id="tab-grammar" class="tab-section active">
<div class="app">
  <header>
    <div class="logo">N<em>3</em> Grammar Flashcards</div>
    <div class="prog-wrap">
      <div class="prog-bar"><div class="prog-fill" id="prog-fill" style="width:0%"></div></div>
      <div class="prog-label" id="prog-label">0 / 0 mastered</div>
    </div>
    <div class="search-wrap">
      <input type="text" id="search" placeholder="Search grammar or meaning..." oninput="renderDeck()" />
    </div>
  </header>

  <div class="filters" id="filters">
    <button class="filter-btn active" onclick="setFilter('all',this)">All</button>
    <button class="filter-btn" onclick="setFilter('core',this)">Core only</button>
    <button class="filter-btn" onclick="setFilter('remaining',this)">Remaining</button>
    <button class="filter-btn" onclick="setFilter('mastered',this)">Mastered</button>
    <select id="cat-filter" onchange="renderDeck()">
      <option value="">All categories</option>
    </select>
  </div>

  <div class="deck-stats" id="deck-stats"></div>
  <div class="deck" id="deck"></div>

  <div class="card-view" id="card-view">
    <button class="ctrl-back" onclick="showDeck()">← back to deck</button>
    <div class="flashcard" id="flashcard"></div>
    <div class="card-controls">
      <button class="ctrl-btn" onclick="navCard(-1)">← prev</button>
      <button class="ctrl-btn primary" onclick="navCard(1)">next →</button>
      <button class="ctrl-btn mastered-btn" id="master-btn" onclick="toggleMastered()">○ mark mastered</button>
      <button class="ctrl-btn" onclick="showDeck()" style="margin-left:auto;">⊞ grid</button>
    </div>
  </div>
</div>
</div><!-- end tab-grammar -->

<!-- Vocab Tab Sections -->
<div id="tab-vocab1" class="tab-section">
  <div class="vocab-section">
    <div class="vocab-inner">
      <div class="vocab-header">
        <div class="vocab-title">N3 Vocab — Set 1</div>
        <div class="vocab-counter" id="v1-counter">0 / 0</div>
      </div>
      <div class="vocab-groups" id="v1-groups"></div>
      <div class="vocab-prog"><div class="vocab-prog-fill" id="v1-prog" style="width:0%"></div></div>
      <div class="vocab-card" id="v1-card" onclick="vFlip(1)">
        <div class="vocab-card-front" id="v1-front"></div>
        <div class="vocab-card-back" id="v1-back"></div>
      </div>
      <div class="vocab-controls">
        <button class="vc-btn" onclick="vNav(1,-1)">← prev</button>
        <button class="vc-btn primary" onclick="vNav(1,1)">next →</button>
        <button class="vc-btn known" id="v1-known" onclick="vMark(1,'known')">覚えた！⭐</button>
        <button class="vc-btn hard" id="v1-hard" onclick="vMark(1,'hard')">難しい ✗</button>
      </div>
    </div>
  </div>
</div>

<div id="tab-vocab2" class="tab-section">
  <div class="vocab-section">
    <div class="vocab-inner">
      <div class="vocab-header">
        <div class="vocab-title">N3 Vocab — Set 2</div>
        <div class="vocab-counter" id="v2-counter">0 / 0</div>
      </div>
      <div class="vocab-groups" id="v2-groups"></div>
      <div class="vocab-prog"><div class="vocab-prog-fill" id="v2-prog" style="width:0%"></div></div>
      <div class="vocab-card" id="v2-card" onclick="vFlip(2)">
        <div class="vocab-card-front" id="v2-front"></div>
        <div class="vocab-card-back" id="v2-back"></div>
      </div>
      <div class="vocab-controls">
        <button class="vc-btn" onclick="vNav(2,-1)">← prev</button>
        <button class="vc-btn primary" onclick="vNav(2,1)">next →</button>
        <button class="vc-btn known" id="v2-known" onclick="vMark(2,'known')">覚えた！⭐</button>

let mastered = new Set(JSON.parse(localStorage.getItem('n3fc_mastered') || '[]'));
let filter = 'all';
let catFilter = '';
let currentIdx = 0;
let filteredCards = [];

function save() {
  try { localStorage.setItem('n3fc_mastered', JSON.stringify([...mastered])); } catch(e) {}
}

function setFilter(f, btn) {
  filter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  renderDeck();
}

function getFiltered() {
  const q = document.getElementById('search').value.toLowerCase();
  const cf = document.getElementById('cat-filter').value;
  return cards.filter(c => {
    const matchQ = !q || c.grammar.includes(q) || c.meaning.toLowerCase().includes(q) || c.category.toLowerCase().includes(q);
    const matchCat = !cf || c.category === cf;
    const matchF = filter === 'all' || (filter === 'core' && c.priority === 'core') || (filter === 'mastered' && mastered.has(c.grammar)) || (filter === 'remaining' && !mastered.has(c.grammar));
    return matchQ && matchCat && matchF;
  });
}

function populateCatFilter() {
  const cats = [...new Set(cards.map(c => c.category))];
  const sel = document.getElementById('cat-filter');
  cats.forEach(cat => {
    const o = document.createElement('option');
    o.value = cat; o.textContent = cat;
    sel.appendChild(o);
  });
}

function updateProgress() {
  const pct = Math.round(mastered.size / cards.length * 100);
  document.getElementById('prog-fill').style.width = pct + '%';
  document.getElementById('prog-label').textContent = `${mastered.size} / ${cards.length} mastered`;
}

function renderDeck() {
  filteredCards = getFiltered();
  const deck = document.getElementById('deck');
  deck.innerHTML = filteredCards.length ? filteredCards.map((c, i) => `
    <div class="mini-card ${mastered.has(c.grammar) ? 'mastered' : ''}" onclick="openCard(${i})">
      <div class="mc-cat">${c.category}</div>
      <div class="mc-grammar">${c.grammar}</div>
      <div class="mc-meaning">${c.meaning}</div>
      ${c.priority === 'core' ? '<span class="mc-badge badge-core">core</span>' : ''}
      ${mastered.has(c.grammar) ? '<span class="mc-badge badge-done" style="top:28px">✓</span>' : ''}
    </div>
  `).join('') : '<div class="empty">No cards match.</div>';
  updateProgress();
}

function openCard(idx) {
  currentIdx = idx;
  document.getElementById('deck').classList.add('hidden');
  document.getElementById('card-view').classList.add('active');
  renderCard();
}

function showDeck() {
  document.getElementById('deck').classList.remove('hidden');
  document.getElementById('card-view').classList.remove('active');
  renderDeck();
}

function navCard(dir) {
  currentIdx = (currentIdx + dir + filteredCards.length) % filteredCards.length;
  renderCard();
  window.scrollTo(0, 0);
}

function toggleMastered() {
  const c = filteredCards[currentIdx];
  if (mastered.has(c.grammar)) mastered.delete(c.grammar);
  else mastered.add(c.grammar);
  save();
  renderCard();
  updateProgress();
}

function renderCard() {
  const c = filteredCards[currentIdx];
  const isMastered = mastered.has(c.grammar);
  const btn = document.getElementById('master-btn');
  btn.textContent = isMastered ? '✓ mastered' : '○ mark mastered';
  btn.classList.toggle('done', isMastered);

  const fc = document.getElementById('flashcard');
  fc.innerHTML = `
    <div class="card-top">
      <div class="card-nav-label">${currentIdx + 1} of ${filteredCards.length} · ${c.category}</div>
      <div class="card-cat-badge">${c.category}</div>
      <div class="card-grammar">${c.grammar}</div>
      <div class="card-reading">${c.reading}</div>
      <div class="card-meaning">${c.meaning}</div>
    </div>
    <div class="card-body">
      <div class="section">
        <div class="section-label">Formation</div>
        <div class="formation-grid">
          ${c.formation.map(f => `<div class="formation-row"><span class="f-type">${f.type}</span><span class="f-form">${f.form}</span></div>`).join('')}
        </div>
      </div>
      <div class="section">

        <div class="nuance-text">${c.nuance}</div>
      </div>
      <div class="section">
        <div class="section-label">Use Cases</div>
        <div class="use-list">
          ${c.usecases.map(u => `<div class="use-item"><span class="use-dot">▸</span><span>${u}</span></div>`).join('')}
        </div>
      </div>
      ${c.contrast ? `<div class="section">
        <div class="section-label">Contrast</div>
        <div class="contrast-grid">
          ${c.contrast.map(r => `<div class="contrast-row"><span class="contrast-tag ${r.tag === 'this' ? 'ct-this' : 'ct-other'}">${r.label}</span><span class="contrast-text">${r.text}</span></div>`).join('')}
        </div>
      </div>` : ''}
      <div class="section">
        <div class="section-label">Examples (i+1)</div>
        <div class="examples">
          ${c.examples.map(e => `
            <div class="example ${e.level === 'iplus' ? 'iplus' : ''}">
              <span class="ex-badge ${e.level === 'iplus' ? 'badge-iplus' : 'badge-n3'}">${e.level === 'iplus' ? 'i+1 stretch' : 'N3 level'}</span>
              <div class="ex-jp">${e.jp}</div>
              <div class="ex-np">${e.np}</div>

            </div>
          `).join('')}
        </div>
      </div>
    </div>
  `;
}

document.addEventListener('keydown', e => {
  if (!document.getElementById('card-view').classList.contains('active')) return;
  if (e.key === 'ArrowRight') navCard(1);

const VOCAB_GROUPS = [
  ["Time & Frequency","Emotion & State","Cause & Result","Social & Communication","Daily Actions","Quantity & Degree","Work & Study","Society & Abstract"],
  ["Verbs of Change","Thinking & Judgment","Human Relations","Movement & Direction","State & Condition","Degree & Extent","Work & Society","Nature & Time"],

];

const VOCAB_DATA = [null, null, null, null, null]; // index 1-4

// ═══════════════════════════════════════════════
// VOCAB ENGINE
// ═══════════════════════════════════════════════
const vState = {};
for (let i = 1; i <= 4; i++) {
  vState[i] = { idx: 0, group: -1, flipped: false, known: {}, hard: {} };
}

function vGetList(n) {
  const s = vState[n];
  const data = VOCAB_DATA[n];
  if (s.group === -1) return data;
  return data.filter(v => v.group === s.group);
}

function vRender(n) {
  const s = vState[n];
  const list = vGetList(n);
  const card = document.getElementById('v'+n+'-card');
  const front = document.getElementById('v'+n+'-front');
  const back = document.getElementById('v'+n+'-back');
  const counter = document.getElementById('v'+n+'-counter');
  const prog = document.getElementById('v'+n+'-prog');
  const knownBtn = document.getElementById('v'+n+'-known');
  const hardBtn = document.getElementById('v'+n+'-hard');

  if (!list || list.length === 0) {
    front.innerHTML = '<p style="color:#5a4f80">No cards</p>';
    counter.textContent = '0 / 0';
    return;
  }

  s.flipped = false;
  card.classList.remove('flipped');

  const v = list[s.idx];
  const groups = VOCAB_GROUPS[n-1];
  counter.textContent = (s.idx + 1) + ' / ' + list.length;

  // Progress based on known
  const knownCount = list.filter(x => s.known[x.word]).length;
  prog.style.width = Math.round(knownCount / list.length * 100) + '%';

  // Front
  front.innerHTML = `
    <div class="vocab-group-label">${groups[v.group] || ''}</div>
    <div class="vocab-word">${v.wordRuby}</div>
    <div class="vocab-pos">${v.pos}</div>
    <div class="vocab-flip-hint">tap to reveal</div>
  `;

  // Back
  let particlesHtml = '';
  if (v.particles && v.particles.length) {
    particlesHtml = `<div class="vocab-back-section">
      <div class="vocab-back-label">Key Patterns</div>
      ${v.particles.map(p => `<div class="vocab-particle-row">
        <div class="vocab-particle-ruby">${p.ruby}</div>
        <div class="vocab-particle-en">${p.meaning || p.en || ''}</div>
      </div>`).join('')}
    </div>`;
  }
  let examplesHtml = '';
  if (v.examples && v.examples.length) {
    examplesHtml = `<div class="vocab-back-section">
      <div class="vocab-back-label">Examples</div>
      ${v.examples.map(e => `<div class="vocab-example">
        <div class="vocab-example-jp">${e.ruby}</div>
        <div class="vocab-example-en">${e.en}</div>
      </div>`).join('')}
    </div>`;
  }
  back.innerHTML = `
    <div class="vocab-keyword">${v.keyword}</div>
    <div class="vocab-meaning">${v.meaning}</div>
    ${particlesHtml}
    ${examplesHtml}
  `;

  // Mark buttons
  knownBtn.classList.toggle('active', !!s.known[v.word]);
  hardBtn.classList.toggle('active', !!s.hard[v.word]);
}

function vFlip(n) {
  const s = vState[n];
  s.flipped = !s.flipped;
  document.getElementById('v'+n+'-card').classList.toggle('flipped', s.flipped);
}

function vNav(n, dir) {
  const s = vState[n];
  const list = vGetList(n);
  if (!list || list.length === 0) return;
  s.idx = (s.idx + dir + list.length) % list.length;
  vRender(n);
}

function vMark(n, type) {
  const s = vState[n];
  const list = vGetList(n);
  if (!list || list.length === 0) return;
  const v = list[s.idx];
  if (type === 'known') {
    s.known[v.word] = !s.known[v.word];
    if (s.known[v.word]) delete s.hard[v.word];
  } else {
    s.hard[v.word] = !s.hard[v.word];
    if (s.hard[v.word]) delete s.known[v.word];
  }
  vRender(n);
}

function vSetGroup(n, g, btn) {
  vState[n].group = g;
  vState[n].idx = 0;
  document.querySelectorAll('#v'+n+'-groups .vg-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  vRender(n);
}

function vInitGroups(n) {
  const groups = VOCAB_GROUPS[n-1];
  const container = document.getElementById('v'+n+'-groups');
  let html = `<button class="vg-btn active" onclick="vSetGroup(${n},-1,this)">All</button>`;
  groups.forEach((g, i) => {
    html += `<button class="vg-btn" onclick="vSetGroup(${n},${i},this)">${g}</button>`;
  });
  container.innerHTML = html;
}
